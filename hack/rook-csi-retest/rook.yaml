- name: Upgrade from 1.18.x
  flags: "yes"
  installerSpec:
    kurl:
      installerVersion: "v2026.09.20-0-825e448f5"
    sonobuoy:
      version: "0.57.3"
    kubernetes:
      version: "1.34.11"
    flannel:
      version: "0.28.9"
    containerd:
      version: "2.3.3"
    minio:
      version: "2025-10-15T17-29-55Z"
    kotsadm:
      version: "1.132.0"
    ekco:
      version: "0.28.16"
    rook:
      version: "1.18.11"
  upgradeSpec:
    kurl:
      installerVersion: "v2026.09.20-0-rc-rook-27348763f"
    sonobuoy:
      version: "0.57.3"
    kubernetes:
      version: "1.34.11"
    flannel:
      version: "0.28.9"
    containerd:
      version: "2.3.3"
    minio:
      version: "2025-10-15T17-29-55Z"
    kotsadm:
      version: "1.132.0"
    ekco:
      version: "0.28.16"
    rook:
      version: "1.20.8"
      s3Override: "https://kurl-sh.s3.amazonaws.com/pr/swimlane-6134-2734876-rook-1.20.8.tar.gz"
      bypassUpgradeWarning: true
  unsupportedOSIDs:
    - centos-79 # Rook 1.13+ is not supported on centos-7
    - ol-79 # Rook 1.13+ is not supported on centos-7
    - ol-8x
    - amzn-20
    - ubuntu-1804
  preInstallScript: |
    source /opt/kurl-testgrid/testhelpers.sh
    # BEGIN GENERATED os-matrix: ubuntu-host-packages — edit os-matrix.yaml, run 'make generate-os-matrix'
    ubuntu_2404_install_host_packages lvm2
    ubuntu_2604_install_host_packages lvm2
    # END GENERATED os-matrix: ubuntu-host-packages
    rhel_9_install_host_packages lvm2 conntrack-tools socat container-selinux git
    rhel_10_install_host_packages lvm2 conntrack-tools socat container-selinux git
  postInstallScript: |
    source /opt/kurl-testgrid/testhelpers.sh
    rook_ceph_object_store_info
    validate_read_write_object_store rwtest testfile.txt

    minio_object_store_info
    validate_read_write_object_store rwtest minio.txt
  postUpgradeScript: |
    source /opt/kurl-testgrid/testhelpers.sh

    # the node isn't ready for long enough after the k8s upgrade for the pods with pvcs to schedule
    wait_for_minio_ready

    operatorVersion=$(kubectl get deployment -n rook-ceph rook-ceph-operator -o jsonpath='{.spec.template.spec.containers[0].image}')
    echo $operatorVersion | grep 1.20.8

    rook_ceph_object_store_info
    validate_testfile rwtest testfile.txt
    validate_read_write_object_store postupgrade upgradefile.txt

    minio_object_store_info
    validate_testfile rwtest minio.txt
    validate_read_write_object_store postupgrade minioupgrade.txt

    # validate data pools
    cat <<EOF | kubectl apply -f -
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: cephfs-pvc
    spec:
      accessModes:
      - ReadWriteMany
      resources:
        requests:
          storage: 1Gi
      storageClassName: rook-cephfs
    ---
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: default-pvc
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
    EOF
    kubectl -n default get pvc
    sleep 30
    echo "after sleeping"
    kubectl -n default get pvc
    kubectl -n default get pvc default-pvc | grep Bound
    kubectl -n default get pvc cephfs-pvc | grep Bound
    kubectl -n default delete pvc cephfs-pvc default-pvc

