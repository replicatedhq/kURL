name: deploy-branch-staging

# Manually build a kURL branch and run a Testgrid run against a unique staging
# version. This workflow does NOT overwrite the default staging/VERSION or the
# unversioned staging/ packages, so it does not affect other users of staging.
#
# Usage:
#   1. Push the branch you want to test.
#   2. Go to Actions > deploy-branch-staging > Run workflow.
#   3. Choose the branch, pick a Testgrid spec and OS spec, and run.
#   4. The workflow uploads everything to s3://kurl-sh/staging/<VERSION_TAG>/ and
#      queues Testgrid with --kurl-version <VERSION_TAG>.

on:
  workflow_dispatch:
    inputs:
      testgrid-spec:
        description: 'Testgrid test spec file (relative to repo root)'
        required: true
        default: 'testgrid/specs/ubuntu-2604.yaml'
        type: string
      testgrid-os-spec:
        description: 'Testgrid OS spec file (relative to repo root)'
        required: true
        default: 'testgrid/specs/os-ubuntu-2604.yaml'
        type: string
      testgrid-ref:
        description: 'Testgrid ref (defaults to branch + version + timestamp)'
        required: false
        type: string
      priority:
        description: 'Testgrid run priority'
        required: true
        default: '0'
        type: string
      airgap:
        description: 'Run in airgap mode'
        required: false
        default: false
        type: boolean
      overwrite-ref:
        description: 'Overwrite an existing Testgrid ref'
        required: false
        default: false
        type: boolean
      version-tag:
        description: 'Override the kURL version tag (defaults to latest-tag-branch-sha)'
        required: false
        type: string
      build-strategy:
        description: 'Package build strategy: full (build everything from source) or core-only (build core packages, copy the rest from the previous staging release)'
        required: true
        default: 'core-only'
        type: choice
        options:
          - full
          - core-only
      build-kurl-util-image:
        description: 'Build and push a branch-specific replicated/kurl-util:<VERSION_TAG> image'
        required: true
        default: true
        type: boolean
      update-default-staging-json:
        description: 'Overwrite the unversioned staging addons-gen.json / supported-versions-gen.json'
        required: false
        default: false
        type: boolean

  # Temporary push trigger so this workflow can be tested on the ubuntu-2604 branch
  # before it is merged to main. Remove this block before merging.
  push:
    branches:
      - ubuntu-2604

jobs:
  get-tag:
    runs-on: ubuntu-24.04
    outputs:
      version_tag: ${{ steps.set-tag.outputs.version_tag }}
      prev_version: ${{ steps.set-tag.outputs.prev_version }}
      branch_name: ${{ steps.set-tag.outputs.branch_name }}
      kurl_util_image: ${{ steps.set-tag.outputs.kurl_util_image }}
      testgrid_ref: ${{ steps.set-tag.outputs.testgrid_ref }}
    steps:
      - uses: actions/checkout@v7

      - id: set-tag
        run: |
          git fetch --tags -f

          BRANCH="${GITHUB_REF_NAME//\//-}"
          LATEST_TAG=$(git tag | grep '^v20' | sort | tail -1)
          SHORT_SHA=$(git rev-parse --short HEAD)

          if [ -n "${{ inputs.version-tag }}" ]; then
            VERSION_TAG="${{ inputs.version-tag }}"
          else
            VERSION_TAG="${LATEST_TAG}-${BRANCH}-${SHORT_SHA}"
          fi

          if [ "${{ inputs.build-kurl-util-image }}" = "true" ]; then
            KURL_UTIL_IMAGE="replicated/kurl-util:${VERSION_TAG}"
          else
            KURL_UTIL_IMAGE="replicated/kurl-util:alpha"
          fi

          REF="${{ inputs.testgrid-ref }}"
          if [ -z "$REF" ]; then
            REF="BRANCH-${BRANCH}-${VERSION_TAG}-$(date --utc +%FT%TZ)"
          fi

          PREV_VERSION=$(curl -s "https://kurl-sh.s3.amazonaws.com/staging/VERSION")

          echo "prev_version=$PREV_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "kurl_util_image=$KURL_UTIL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "testgrid_ref=$REF" >> "$GITHUB_OUTPUT"

          echo "prev_version=$PREV_VERSION"
          echo "version_tag=$VERSION_TAG"
          echo "kurl_util_image=$KURL_UTIL_IMAGE"
          echo "testgrid_ref=$REF"

  kurl-util-image:
    runs-on: ubuntu-24.04
    needs:
      - get-tag
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        if: inputs.build-kurl-util-image
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: build and push kurl-util image
        if: inputs.build-kurl-util-image
        env:
          VERSION_TAG: ${{ needs.get-tag.outputs.version_tag }}
          KURL_UTIL_IMAGE: ${{ needs.get-tag.outputs.kurl_util_image }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make -C kurl_util build-and-push-kurl-util-image

      - name: skip kurl-util image build
        if: ${{ !inputs.build-kurl-util-image }}
        run: |
          echo "Using existing kurl-util image: ${{ needs.get-tag.outputs.kurl_util_image }}"

  build-matrix:
    runs-on: ubuntu-24.04
    needs:
      - get-tag
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - id: set-matrix
        name: Build package matrix
        env:
          VERSION_TAG: ${{ needs.get-tag.outputs.version_tag }}
          KURL_UTIL_IMAGE: ${{ needs.get-tag.outputs.kurl_util_image }}
          KURL_BIN_UTILS_FILE: kurl-bin-utils-${{ needs.get-tag.outputs.version_tag }}.tar.gz
        run: |
          if [ "${{ inputs.build-strategy }}" = "core-only" ]; then
            CORE_BATCH="install.tmpl join.tmpl upgrade.tmpl tasks.tmpl common.tar.gz kurl-bin-utils-${VERSION_TAG}.tar.gz"
            OUTPUT=$(printf '{"include": [{"batch": "%s"}]}' "$CORE_BATCH")
          else
            OUTPUT=$(./bin/list-all-packages-actions-matrix.sh)
          fi
          echo "matrix=$OUTPUT" >> "$GITHUB_OUTPUT"

  copy-packages-from-staging:
    runs-on: ubuntu-24.04
    needs:
      - get-tag
    if: inputs.build-strategy == 'core-only'
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - id: set-matrix
        name: Build copy matrix from previous staging
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PROD_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PROD_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-1"
          S3_BUCKET: kurl-sh
          STAGING_RELEASE: ${{ needs.get-tag.outputs.prev_version }}
          KURL_UTIL_IMAGE: replicated/kurl-util:alpha
          KURL_BIN_UTILS_FILE: kurl-bin-utils-latest.tar.gz
        run: |
          if [ -z "${STAGING_RELEASE}" ]; then
            echo "error: could not read current staging/VERSION"
            exit 1
          fi
          echo "copying packages from previous staging release ${STAGING_RELEASE}"
          LIST_FROM_STAGE_S3=1 ./bin/list-all-packages-actions-matrix.sh

  copy-packages:
    runs-on: ubuntu-24.04
    needs:
      - get-tag
      - copy-packages-from-staging
    if: inputs.build-strategy == 'core-only'
    strategy:
      matrix: ${{ fromJSON(needs.copy-packages-from-staging.outputs.matrix) }}
      fail-fast: false
      max-parallel: 20
    steps:
      - name: copy packages from previous staging
        env:
          S3_BUCKET: kurl-sh
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PROD_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PROD_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-1"
          AWS_DEFAULT_REGION: "us-east-1"
          VERSION_TAG: ${{ needs.get-tag.outputs.version_tag }}
          PREV_VERSION: ${{ needs.get-tag.outputs.prev_version }}
        run: |
          for package in ${{ matrix.batch }}; do
            echo "copying ${package} from staging/${PREV_VERSION} to staging/${VERSION_TAG}"
            aws s3api copy-object \
              --copy-source "${S3_BUCKET}/staging/${PREV_VERSION}/${package}" \
              --bucket "${S3_BUCKET}" \
              --key "staging/${VERSION_TAG}/${package}"
          done

  build-and-upload:
    runs-on: ubuntu-24.04
    needs:
      - get-tag
      - build-matrix
      - kurl-util-image
    strategy:
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix) }}
      fail-fast: false
      max-parallel: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: setup env
        id: env
        run: |
          echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: build and upload versioned packages
        env:
          S3_BUCKET: kurl-sh
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PROD_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PROD_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-1"
          AWS_DEFAULT_REGION: "us-east-1"
          VERSION_TAG: ${{ needs.get-tag.outputs.version_tag }}
          KURL_UTIL_IMAGE: ${{ needs.get-tag.outputs.kurl_util_image }}
          KURL_BIN_UTILS_FILE: kurl-bin-utils-${{ needs.get-tag.outputs.version_tag }}.tar.gz
        run: |
          for package in ${{ matrix.batch }}; do
            echo "building package ${package}"
            make "dist/${package}"

            MD5="$(openssl md5 -binary "dist/${package}" | base64)"
            GITSHA="$(git rev-parse HEAD)"

            echo "uploading package ${package} to s3://${S3_BUCKET}/staging/${VERSION_TAG}/${package}"
            aws s3 cp "dist/${package}" "s3://${S3_BUCKET}/staging/${VERSION_TAG}/${package}" \
              --metadata-directive REPLACE --metadata md5="${MD5}",gitsha="${GITSHA}"

            make clean
          done

  generate-addons:
    runs-on: ubuntu-24.04
    needs:
      - get-tag
      - build-and-upload
      - copy-packages
    if: always() && needs.build-and-upload.result == 'success' && (needs.copy-packages.result == 'success' || needs.copy-packages.result == 'skipped')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '18'

      - run: npm install

      - name: generate addon metadata
        env:
          S3_BUCKET: kurl-sh
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PROD_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PROD_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "us-east-1"
          DIST_FOLDER: "staging"
          VERSION_TAG: ${{ needs.get-tag.outputs.version_tag }}
        run: |
          make generate-addons

      - name: restore default staging metadata
        if: ${{ !inputs.update-default-staging-json }}
        env:
          S3_BUCKET: kurl-sh
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PROD_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PROD_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "us-east-1"
        run: |
          PREV_VERSION=$(curl -s "https://kurl-sh.s3.amazonaws.com/staging/VERSION")
          if [ -z "$PREV_VERSION" ]; then
            echo "warning: could not read current staging/VERSION; leaving default staging metadata as-is"
            exit 0
          fi
          echo "restoring default staging metadata from ${PREV_VERSION}"
          aws s3 cp "s3://${S3_BUCKET}/staging/${PREV_VERSION}/addons-gen.json" "s3://${S3_BUCKET}/staging/addons-gen.json"
          aws s3 cp "s3://${S3_BUCKET}/staging/${PREV_VERSION}/supported-versions-gen.json" "s3://${S3_BUCKET}/staging/supported-versions-gen.json"

  testgrid-run:
    runs-on: ubuntu-24.04
    needs:
      - get-tag
      - generate-addons
      - kurl-util-image
    steps:
      - uses: actions/checkout@v7

      - name: pin empty installerVersion values to branch version
        env:
          VERSION_TAG: ${{ needs.get-tag.outputs.version_tag }}
          TESTGRID_SPEC: ${{ inputs.testgrid-spec }}
        run: |
          sed -i "s/installerVersion: \"\"/installerVersion: \"${VERSION_TAG}\"/g" "${TESTGRID_SPEC}"

      - name: pull tgrun
        run: |
          docker pull replicated/tgrun:latest

      - name: queue testgrid run
        id: queue
        env:
          TESTGRID_API_TOKEN: ${{ secrets.TESTGRID_PROD_API_TOKEN }}
          VERSION_TAG: ${{ needs.get-tag.outputs.version_tag }}
          TESTGRID_REF: ${{ needs.get-tag.outputs.testgrid_ref }}
          TESTGRID_SPEC: ${{ inputs.testgrid-spec }}
          TESTGRID_OS_SPEC: ${{ inputs.testgrid-os-spec }}
          PRIORITY: ${{ inputs.priority }}
        run: |
          AIRGAP_FLAG=""
          if [ "${{ inputs.airgap }}" = "true" ]; then
            AIRGAP_FLAG="--airgap"
          fi

          OVERWRITE_FLAG=""
          if [ "${{ inputs.overwrite-ref }}" = "true" ]; then
            OVERWRITE_FLAG="--overwrite-ref"
          fi

          docker run --rm -e TESTGRID_API_TOKEN -v "$(pwd)":/wrk -w /wrk \
            replicated/tgrun:latest queue --staging \
              --kurl-version "${VERSION_TAG}" \
              --ref "${TESTGRID_REF}" \
              --spec "${TESTGRID_SPEC}" \
              --os-spec "${TESTGRID_OS_SPEC}" \
              --priority "${PRIORITY}" \
              ${AIRGAP_FLAG} \
              ${OVERWRITE_FLAG}

          MSG="Testgrid Run(s) Executing @ https://testgrid.kurl.sh/run/${TESTGRID_REF}"
          echo "msg=$MSG" >> "$GITHUB_OUTPUT"
          echo "::notice ::${MSG}"
