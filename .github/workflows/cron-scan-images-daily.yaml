name: cron-scan-images-daily

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      notify:
        description: Post the report to Slack even if it isn't Monday
        type: boolean
        default: false

jobs:
  build-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/setup-node@v7
      - uses: actions/checkout@v7
      - name: Install dependencies
        working-directory: ./bin/scan-images/
        run: npm install
      - id: set-matrix
        name: Build image matrix
        run: |
          echo "matrix<<EOF" >> "$GITHUB_OUTPUT"
          ./bin/scan-images/matrix.js >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  scan-images:
    name: ${{ matrix.addon }}:${{ matrix.version }} - ${{ matrix.name }}
    needs: build-matrix
    runs-on: ubuntu-24.04
    strategy:
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix) }}
      fail-fast: false
      max-parallel: 5
    steps:
      - name: Checkout for Grype config
        uses: actions/checkout@v7
        with:
          sparse-checkout: .grype.yaml
          sparse-checkout-cone-mode: false

      - name: Install Syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Install Grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: "Scan image (OS vulnerabilities only)"
        id: scan
        continue-on-error: ${{ ! matrix.alert }}
        env:
          MATRIX: ${{ toJSON(matrix) }}
        run: |
          echo "$MATRIX" > meta.json
          syft ${{ matrix.image }} -o syft-json --select-catalogers "os" > sbom.json
          grype sbom:./sbom.json -c .grype.yaml --fail-on high --only-fixed -o json > grype.json

      - name: "Upload artifact"
        uses: actions/upload-artifact@v7
        if: ${{ always() && steps.scan.outcome == 'failure' }}
        with:
          name: ${{ matrix.addon }}-${{ matrix.version }}-${{ matrix.name }}
          path: |
            grype.json
            meta.json

      - name: "Display results"
        if: ${{ always() && steps.scan.outcome == 'failure' }}
        continue-on-error: ${{ ! matrix.alert }}
        run: grype sbom:./sbom.json -c .grype.yaml --fail-on high --only-fixed -o table

  collect-results:
    needs: scan-images
    runs-on: ubuntu-24.04
    if: ${{ failure() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      - name: Install dependencies
        working-directory: ./bin/scan-images/
        run: npm ci
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: scan-results/
      - name: Collect results
        run: |
          jq -s '.' scan-results/*/grype.json > grype.json
      - name: "Upload artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype results
          path: grype.json

      # The scan runs daily, but we only ping Slack on Mondays so the findings
      # land ahead of the weekly release. A manual run can force it.
      - name: Post report to Slack
        if: ${{ (github.event_name == 'schedule' || inputs.notify) && !cancelled() }}
        env:
          SLACK_WEBHOOK: ${{ secrets.KURL_CVE_ALERTS_SLACK_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FORCE: ${{ inputs.notify }}
        run: |
          if [ "$FORCE" != "true" ] && [ "$(date -u +%u)" != "1" ]; then
            echo "Not Monday, skipping Slack report"
            exit 0
          fi
          ./bin/scan-images/report.js scan-results/ --run-url "$RUN_URL" > payload.json
          if [ ! -s payload.json ]; then
            echo "No findings to report"
            exit 0
          fi
          curl -sSf -X POST -H 'Content-Type: application/json' --data @payload.json "$SLACK_WEBHOOK"
