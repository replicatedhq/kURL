
name: test-addon-pr.yaml

on:
  pull_request:
    branches:
      - main
    paths:
      - 'addons/**'
      - '!.claude/**'

  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-addons:
    if: >-
      ${{ github.repository_owner == 'replicatedhq' &&
         github.actor != 'dependabot' &&
         !contains(github.event.pull_request.labels.*.name, 'skip-testgrid') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read # actions/checkout
      issues: write # the ensure-sticky step posts via the issues API
    outputs:
      addons: ${{ steps.check.outputs.addons }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for Modified Addons
        id: check
        run: |
          ./bin/addon-has-changes-matrix.sh

      # Each matrix leg appends its own line to ONE sticky comment on the PR
      # as it finishes. Create the comment up front in this single job so the
      # parallel legs only ever append to it and never race to create it.
      - name: Ensure the Testgrid sticky comment exists
        if: github.event_name == 'pull_request' && steps.check.outputs.addons != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./bin/pr-sticky-upsert.sh \
            "${{ github.event.pull_request.number }}" \
            "<!-- kurl-testgrid-addon-runs -->" \
            "**Testgrid runs** (updated per add-on version as each matrix leg finishes):"

  test-addons:
    needs: check-addons
    if: needs.check-addons.outputs.addons
    strategy:
      matrix: ${{ fromJSON(needs.check-addons.outputs.addons) }}
      fail-fast: false
      max-parallel: 5
    # A called workflow's token is capped by this job's permissions, so the
    # legs' sticky-comment writes need issues: write granted here.
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/test-addon.yaml
    with:
      addon: ${{ matrix.addon }}
      version: ${{ matrix.version }}
      prefix: ${{ matrix.prefix }}
    secrets: inherit
