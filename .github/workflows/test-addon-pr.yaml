
name: test-addon-pr.yaml

on:
  pull_request:
    branches:
      - main
    paths:
      - 'addons/**'
      - '!.claude/**'

  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-addons:
    if: >-
      ${{ github.repository_owner == 'replicatedhq' &&
         github.actor != 'dependabot' &&
         !contains(github.event.pull_request.labels.*.name, 'skip-testgrid') }}
    runs-on: ubuntu-24.04
    outputs:
      addons: ${{ steps.check.outputs.addons }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for Modified Addons
        id: check
        run: |
          ./bin/addon-has-changes-matrix.sh

  test-addons:
    needs: check-addons
    if: needs.check-addons.outputs.addons
    strategy:
      matrix: ${{ fromJSON(needs.check-addons.outputs.addons) }}
      fail-fast: false
      max-parallel: 5
    uses: ./.github/workflows/test-addon.yaml
    with:
      addon: ${{ matrix.addon }}
      version: ${{ matrix.version }}
      prefix: ${{ matrix.prefix }}
    secrets: inherit

  # Aggregates every test-addons matrix leg's Testgrid run links into ONE
  # sticky PR comment. The message-id is stable per PR (no head sha on
  # purpose), so each push replaces the existing comment instead of piling up
  # a new one per addon version per commit. refresh-message-position deletes
  # and recreates the sticky, which is what fires the per-update notification.
  testgrid-comment:
    needs: test-addons
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request' &&
          needs.test-addons.result != 'skipped' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Collect run links from all matrix legs
        # Fails (expectedly) when no leg queued a run and nothing was
        # uploaded; the build step below asks the artifacts API which case
        # we're in, so a real download failure isn't reported as "no runs".
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          pattern: testgrid-runs-*
          merge-multiple: true
          path: testgrid-comment

      - name: Build aggregated comment
        id: build
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHORT_SHA="${PR_HEAD_SHA:0:7}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          ROWS=""
          if ls testgrid-comment/*.md > /dev/null 2>&1; then
            ROWS=$(cat testgrid-comment/*.md | sort)
          fi
          DOWNLOAD_FAILED=0
          if [ "${DOWNLOAD_OUTCOME}" != "success" ] && [ -z "${ROWS}" ]; then
            # No links landed. Either no leg uploaded any (the genuine
            # no-runs case) or the artifact download itself failed while legs
            # did queue runs. The step outcome alone can't tell them apart;
            # the artifacts API can.
            if ! MATCHING="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                --jq '[.artifacts[] | select(.expired == false) | select(.name | startswith("testgrid-runs-"))] | length')"; then
              MATCHING=1 # can't tell; assume the worst so the failure surfaces
            fi
            if [ "${MATCHING}" -gt 0 ]; then
              DOWNLOAD_FAILED=1
            fi
          fi
          {
            echo "Testgrid Run(s) Executing for commit \`${SHORT_SHA}\`"
            echo
            if [ -n "${ROWS}" ]; then
              echo "| Add-on version | Testgrid run |"
              echo "| --- | --- |"
              echo "${ROWS}"
              echo
              echo "Legs that failed before queueing a run are absent from this table. See the [workflow run](${RUN_URL})."
            elif [ "${DOWNLOAD_FAILED}" = "1" ]; then
              echo "Testgrid runs were queued, but collecting their links failed (artifact download error). See the [workflow run](${RUN_URL})."
            else
              echo "No Testgrid runs were queued. Check the [workflow run](${RUN_URL}) for failures."
            fi
          } > comment.md
          echo "download_failed=${DOWNLOAD_FAILED}" >> "$GITHUB_OUTPUT"
          cat comment.md

      - name: Post sticky summary comment
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          message-id: testgrid-addon-pr-${{ github.event.pull_request.number }}
          message-path: comment.md
          allow-repeats: false
          # Edit-in-place buries the summary under newer conversation;
          # deleting and recreating it floats it to the bottom and fires one
          # notification per update, so there is deliberately no separate
          # run-trail comment.
          refresh-message-position: true

      # The sticky above has been posted honestly; now turn a real collection
      # failure red so it isn't mistaken for a clean "no runs" run.
      - name: Surface artifact download failures
        if: steps.build.outputs.download_failed == '1'
        run: exit 1
