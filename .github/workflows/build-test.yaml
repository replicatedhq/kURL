name: build-test

on:
  pull_request:

jobs:

  detect-changes:
    # Required checks must report on every PR, so instead of a paths-ignore
    # trigger, skip the real jobs when a PR only touches .claude/.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')
          if printf '%s\n' "$files" | grep -qv '^\.claude/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only .claude/ files changed; skipping."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  validate-go-mod:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: setup env
        run: |
          echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
        shell: bash

      - run: go mod tidy -compat=1.17

  build-kurl-utils:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: setup env
        run: |
          echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
        shell: bash

      - run: make -C kurl_util test build

  build-bin-kurl:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: setup env
        run: |
          echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
        shell: bash

      - run: make test build/bin/kurl

  test-shell:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: make docker-test-shell
      - run: make docker-test-containerd

  validate-github-actions-bundles:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify GitHub Actions bundles are up-to-date
        run: |
          set -euo pipefail
          failed=0
          for action_dir in .github/actions/*/; do
            action_yml="${action_dir}action.yml"
            package_json="${action_dir}package.json"
            dist_dir="${action_dir}dist"

            if [ ! -f "$action_yml" ] || [ ! -f "$package_json" ]; then
              continue
            fi

            if ! grep -qE "main: ['\"]dist/index.js['\"]" "$action_yml"; then
              continue
            fi

            echo "Checking ${action_dir}..."
            (
              cd "$action_dir"
              npm ci
              npm run build
            )

            if [ -n "$(git status --porcelain -- "$dist_dir")" ]; then
              echo "ERROR: ${action_dir}dist/ has uncommitted changes."
              echo "Run 'npm run build' in ${action_dir} and commit the changes."
              git status --porcelain -- "$dist_dir"
              git diff -- "$dist_dir" || true
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "All GitHub Actions bundles are up-to-date."

  build-test-success:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - detect-changes
      - validate-go-mod
      - build-kurl-utils
      - build-bin-kurl
      - test-shell
      - validate-github-actions-bundles
    steps:
      - run: |
          if   [ "${{ needs.detect-changes.result }}" != "success" ] \
            || [ "${{ needs.validate-go-mod.result }}" = "failure" ] \
            || [ "${{ needs.build-kurl-utils.result }}" = "failure" ] \
            || [ "${{ needs.build-bin-kurl.result }}" = "failure" ] \
            || [ "${{ needs.test-shell.result }}" = "failure" ] \
            || [ "${{ needs.validate-github-actions-bundles.result }}" = "failure" ]
          then
            echo "build test failure"
            exit 1
          fi
          echo "build test success"
