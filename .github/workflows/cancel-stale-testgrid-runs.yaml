name: cancel-stale-testgrid-runs

# A push cancels the older test-addon-pr.yaml run, but not the Testgrid runs
# it already queued. Cancel the PR's add-on runs (pr-<N>-<sha7>-...) for
# earlier commits so they stop using VMs.

on:
  pull_request:
    types:
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  cancel:
    if: ${{ github.repository_owner == 'replicatedhq' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel Testgrid runs for earlier commits
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          api=https://api.testgrid.kurl.sh
          # pageSize=0 returns every matching run.
          curl -fsS "${api}/api/v1/runs?searchRef=pr-${PR_NUMBER}-&pageSize=0" \
            | jq -r --arg prefix "pr-${PR_NUMBER}-" --arg head "${HEAD_SHA:0:7}" \
                '.runs[] | select(.id | startswith($prefix)) | select(.id | startswith($prefix + $head) | not)
                         | select(.pending_runs + .running_runs > 0) | .id' \
            | while read -r ref; do
                echo "Cancelling ${ref}"
                curl -fsS -X POST "${api}/v1/ref/${ref}/cancel"; echo
              done
