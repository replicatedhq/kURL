name: Restore exact published 825e staging metadata
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: restore-published-staging-metadata
  cancel-in-progress: false
jobs:
  restore-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: repair
      - uses: actions/checkout@v7
        with:
          ref: 825e448f54ffbfa1c2084417fbda6277c7b7ffa9
          path: published
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Generate exact published metadata without uploading
        working-directory: published
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 825e448f54ffbfa1c2084417fbda6277c7b7ffa9
          npm ci --ignore-scripts --no-audit --no-fund
          node ../repair/hack/metadata-825e-repair/generate-local.cjs ../repair/hack/metadata-825e-repair/expected-supported.json
      - name: Restore four metadata objects with concurrency and VERSION guards
        working-directory: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PROD_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PROD_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: python3 ../repair/hack/metadata-825e-repair/publish.py
      - name: Preserve overwritten metadata for audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: metadata-825e-backup
          path: ${{ runner.temp }}/metadata-825e-backup
          if-no-files-found: ignore
