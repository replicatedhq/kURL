name: Rook CSI fix existing Testgrid scenarios
on:
  workflow_dispatch:
jobs:
  rook:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Wait for repaired package build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 36646725102 --repo replicatedhq/kURL --exit-status --interval 30
      - name: Verify exact candidate source
        run: |
          git fetch origin 49563ec309cfe68c8f3076ec90facf1246bf970e
          git diff --exit-code 49563ec309cfe68c8f3076ec90facf1246bf970e -- addons/rook/1.20.7 addons/rook/template/generate.sh
          docker manifest inspect replicated/kurl-util:v2026.09.20-0-825e448f5 > /dev/null
      - name: Publish isolated upgrade metadata and copied assets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PROD_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PROD_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: python3 hack/rook-csi-retest/publish.py
      - name: Verify rendered versions and artifact closure
        run: python3 hack/rook-csi-retest/verify.py
      - name: Queue the existing four Rook scenarios
        env:
          TESTGRID_API_TOKEN: ${{ secrets.TESTGRID_PROD_API_TOKEN }}
        run: |
          set -euo pipefail
          ref="swimlane-6134-csi-49563ec30-${GITHUB_RUN_ID}"
          docker run --rm -e TESTGRID_API_TOKEN -v "$(pwd)":/wrk -w /wrk \
            replicated/tgrun:latest queue --staging \
              --ref "$ref" --spec hack/rook-csi-retest/rook.yaml \
              --os-spec testgrid/specs/os-latest.yaml --priority 0
          echo "::notice ::Testgrid Run Executing @ https://testgrid.kurl.sh/run/$ref"
