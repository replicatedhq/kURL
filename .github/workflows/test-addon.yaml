name: Cert Manager failed-case qualification on published release
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  queue-failed-cases:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Queue exactly ten previously failed cases
        env:
          TESTGRID_API_TOKEN: ${{ secrets.TESTGRID_PROD_API_TOKEN }}
        run: |
          set -euo pipefail
          docker pull replicated/tgrun:latest
          for group in 1 2 3 4; do
            ref="cve-cert-6139-failed-prod-${group}-$(date --utc +%FT%TZ)"
            docker run --rm -e TESTGRID_API_TOKEN -v "$(pwd):/wrk" -w /wrk \
              replicated/tgrun:latest queue \
              --kurl-version v2026.09.20-0 \
              --ref "$ref" \
              --spec "testgrid/cve-cert-failed/spec-${group}.yaml" \
              --os-spec "testgrid/cve-cert-failed/os-${group}.yaml" \
              --priority 0
            echo "::notice ::https://testgrid.kurl.sh/run/${ref}"
          done
