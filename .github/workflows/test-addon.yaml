name: Restore published staging addon metadata

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: restore-published-staging-metadata
  cancel-in-progress: false

jobs:
  restore-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: d86198696006f29714c0eb1bfec0481ba6ec60c2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify published version and restore exact-source metadata
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PROD_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PROD_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          S3_BUCKET: kurl-sh
          DIST_FOLDER: staging
          VERSION_TAG: v2026.09.20-0-d86198696
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d86198696006f29714c0eb1bfec0481ba6ec60c2
          published_version=$(curl --fail --silent --show-error https://kurl-sh.s3.amazonaws.com/staging/VERSION)
          test "$published_version" = "$VERSION_TAG"
          make generate-addons
          node - <<'JS'
          const fs = require('fs');
          const versions = JSON.parse(fs.readFileSync('supported-versions-gen.json')).supportedVersions;
          const latest = key => versions[key].find(v => v !== 'latest');
          if (latest('ekco') !== '0.28.16' || latest('registry') !== '3.1.1') throw new Error('Unexpected generated source versions');
          JS
          for metadata in addons-gen.json supported-versions-gen.json; do
            for prefix in staging "staging/$VERSION_TAG"; do
              curl --fail --silent --show-error "https://kurl-sh.s3.amazonaws.com/$prefix/$metadata" -o /tmp/published-metadata.json
              cmp "$metadata" /tmp/published-metadata.json
            done
          done
          published_version=$(curl --fail --silent --show-error https://kurl-sh.s3.amazonaws.com/staging/VERSION)
          test "$published_version" = "$VERSION_TAG"
