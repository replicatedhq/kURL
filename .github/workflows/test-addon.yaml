name: test-addon.yaml

on:
  workflow_call:
    inputs:
      addon:
        description: Add-on directory name
        required: true
        type: string
      version:
        description: Add-on version directory name
        required: true
        type: string
      prefix:
        description: Prefix for s3 asset and ref. For identification.
        type: string
  workflow_dispatch:
    inputs:
      addon:
        description: Add-on directory name
        required: true
        type: string
      version:
        description: Add-on version directory name
        required: true
        type: string
      prefix:
        description: Prefix for s3 asset and ref. For identification.
        type: string

env:
  addon: ${{ inputs.addon }}
  version: ${{ inputs.version }}
  prefix: ${{ inputs.prefix }}

jobs:
  test-addon:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: add-on build
        id: build
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PROD_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PROD_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "us-east-1"
          S3_BUCKET: "kurl-sh"
        run: |
          ./bin/build-addon-package.sh "${{ env.addon }}" "${{ env.version }}" \
            "addons/${{ env.addon }}/${{ env.version }}" \
            "${{ env.prefix }}"

      # NOTE: Do NOT regenerate supported-versions-gen.json here. That file is
      # the live staging release's metadata (staging/<VERSION_TAG>/), shared by
      # every concurrent staging install and add-on test run; overwriting it
      # from a PR branch advertises versions whose packages only exist under
      # s3://kurl-sh/pr/ and breaks all other installs that resolve them via
      # "latest" (observed as S3 403s on package download). It is also
      # unnecessary: every add-on testgrid spec pairs the version under test
      # with s3Override, and the kURL API skips version validation for add-ons
      # with s3Override, so the new version need not exist in staging metadata.

      - name: tgrun queue
        id: queue
        uses: ./.github/actions/addon-testgrid-tester
        with:
          addon: "${{ env.addon }}"
          version: "${{ env.version }}"
          package-url: "${{ steps.build.outputs.addon_package_url }}"
          testgrid-spec-path: "addons/${{ env.addon }}/template/testgrid"
          testgrid-run-prefix: "${{ env.prefix }}"
          testgrid-api-token: "${{ secrets.TESTGRID_PROD_API_TOKEN }}"
          staging: true

      # Do NOT comment from this job: the caller fans this workflow out into
      # one invocation per (addon, version) matrix leg, so per-leg comments
      # flood the PR (each leg posts its own comment for every pushed commit).
      # Instead, record this leg's Testgrid run links as a run-scoped artifact
      # and let the caller's aggregation job post ONE sticky comment for the
      # whole matrix (see testgrid-comment in test-addon-pr.yaml).
      - name: Record Testgrid run links
        env:
          QUEUED_MESSAGE: ${{ steps.queue.outputs.message }}
        run: |
          set -euo pipefail
          mkdir -p testgrid-comment
          LINKS="${QUEUED_MESSAGE#Testgrid Run(s) Executing @ }"
          echo "| \`${{ env.addon }}-${{ env.version }}\` | ${LINKS} |" \
            > "testgrid-comment/${{ env.addon }}-${{ env.version }}.md"

      - name: Upload Testgrid run links
        uses: actions/upload-artifact@v7
        with:
          name: testgrid-runs-${{ env.addon }}-${{ env.version }}
          path: testgrid-comment/${{ env.addon }}-${{ env.version }}.md
          if-no-files-found: error
