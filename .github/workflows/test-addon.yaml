name: test-addon.yaml
on:
  workflow_dispatch: {}
jobs:
  focused-registry-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Queue focused Registry 3.1.2 tests from PR 6152 artifact
        env:
          TESTGRID_API_TOKEN: ${{ secrets.TESTGRID_PROD_API_TOKEN }}
        run: |
          docker run --rm -e TESTGRID_API_TOKEN -v "$PWD:/wrk:ro" -w /wrk replicated/tgrun:latest queue --staging --ref "pr-6152-9904919e3ed9-focused-$(date --utc +%FT%TZ)" --spec /wrk/testgrid/specs/registry-6152-focused.json --os-spec /wrk/testgrid/specs/registry-6152-os.yaml --priority 0
