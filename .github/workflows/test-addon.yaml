name: test-addon.yaml
on:
  workflow_dispatch: {}
jobs:
  registry-pvc-upgrade-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Prepare smoke test dependencies
        run: |
          command -v htpasswd || (sudo apt-get update && sudo apt-get install -y apache2-utils)
          python3 -m venv "$RUNNER_TEMP/registry-smoke-venv"
          "$RUNNER_TEMP/registry-smoke-venv/bin/pip" install PyYAML==6.0.3
          docker pull registry:3.1.1
          docker pull registry:3.1.2
      - name: Test actual add-on config, TLS, authentication, storage and upgrade persistence
        run: '"$RUNNER_TEMP/registry-smoke-venv/bin/python" testgrid/registry-smoke.py'
