name: test-addon.yaml

on:
  workflow_call:
    inputs:
      addon:
        description: Add-on directory name
        required: true
        type: string
      version:
        description: Add-on version directory name
        required: true
        type: string
      prefix:
        description: Prefix for s3 asset and ref. For identification.
        type: string
  workflow_dispatch:
    inputs:
      addon:
        description: Add-on directory name
        required: true
        type: string
      version:
        description: Add-on version directory name
        required: true
        type: string
      prefix:
        description: Prefix for s3 asset and ref. For identification.
        type: string

env:
  addon: ${{ inputs.addon }}
  version: ${{ inputs.version }}
  prefix: ${{ inputs.prefix }}

jobs:
  test-addon:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: add-on build
        id: build
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PROD_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PROD_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "us-east-1"
          S3_BUCKET: "kurl-sh"
        run: |
          ./bin/build-addon-package.sh "${{ env.addon }}" "${{ env.version }}" \
            "addons/${{ env.addon }}/${{ env.version }}" \
            "${{ env.prefix }}"

      # NOTE: Do NOT regenerate supported-versions-gen.json here. That file is
      # the live staging release's metadata (staging/<VERSION_TAG>/), shared by
      # every concurrent staging install and add-on test run; overwriting it
      # from a PR branch advertises versions whose packages only exist under
      # s3://kurl-sh/pr/ and breaks all other installs that resolve them via
      # "latest" (observed as S3 403s on package download). It is also
      # unnecessary: every add-on testgrid spec pairs the version under test
      # with s3Override, and the kURL API skips version validation for add-ons
      # with s3Override, so the new version need not exist in staging metadata.

      - name: tgrun queue
        id: queue
        uses: ./.github/actions/addon-testgrid-tester
        with:
          addon: "${{ env.addon }}"
          version: "${{ env.version }}"
          package-url: "${{ steps.build.outputs.addon_package_url }}"
          testgrid-spec-path: "addons/${{ env.addon }}/template/testgrid"
          testgrid-run-prefix: "${{ env.prefix }}"
          testgrid-api-token: "${{ secrets.TESTGRID_PROD_API_TOKEN }}"
          staging: true

      # The caller fans this workflow out into one invocation per
      # (addon, version) matrix leg. Every leg appends ONE line to the PR's
      # single sticky comment as it finishes (never rebuilding or replacing
      # the body), so links show up per leg instead of waiting for the
      # slowest one, and a leg that fails leaves a row instead of vanishing.
      # Runs on every outcome so failures are reported too. Only PR-triggered
      # runs have a PR to comment on; manual dispatch runs still surface the
      # links via the step notice above.
      - name: Update Testgrid sticky comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QUEUED_LINKS: ${{ steps.queue.outputs.links }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          QUEUE_OUTCOME: ${{ steps.queue.outcome }}
        run: |
          set -euo pipefail
          SHORT_SHA="${HEAD_SHA:0:7}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          KEY="- \`${{ env.addon }}-${{ env.version }}\` @ \`${SHORT_SHA}\`:"
          if [ "${QUEUE_OUTCOME}" = "success" ] && [ -n "${QUEUED_LINKS// /}" ]; then
            # Fail loudly on message-contract drift rather than posting a
            # malformed line.
            if ! echo "$QUEUED_LINKS" | grep -qE '^https://testgrid\.kurl\.sh/run/\S+( https://testgrid\.kurl\.sh/run/\S+)*$'; then
              echo "::error ::unexpected links output for ${{ env.addon }}-${{ env.version }}: ${QUEUED_LINKS}"
              exit 1
            fi
            LINE="${KEY} ${QUEUED_LINKS}"
          elif [ "${QUEUE_OUTCOME}" = "success" ]; then
            LINE="${KEY} no Testgrid specs matched, nothing was queued"
          elif [ "${BUILD_OUTCOME}" != "success" ]; then
            LINE="${KEY} add-on build failed -- [workflow run](${RUN_URL})"
          else
            LINE="${KEY} failed before queueing a Testgrid run -- [workflow run](${RUN_URL})"
          fi
          ./bin/pr-sticky-upsert.sh "${PR_NUMBER}" "<!-- kurl-testgrid-addon-runs -->" \
            "**Testgrid runs** (updated per add-on version as each matrix leg finishes):" \
            "${KEY}" "${LINE}"
