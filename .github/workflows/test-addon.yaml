name: test-addon.yaml

on:
  workflow_call:
    inputs:
      addon:
        description: Add-on directory name
        required: true
        type: string
      version:
        description: Add-on version directory name
        required: true
        type: string
      prefix:
        description: Prefix for s3 asset and ref. For identification.
        type: string
      update-supported-versions:
        description: 'Update supported-versions-gen.json on staging before running tests.'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      addon:
        description: Add-on directory name
        required: true
        type: string
      version:
        description: Add-on version directory name
        required: true
        type: string
      prefix:
        description: Prefix for s3 asset and ref. For identification.
        type: string
      update-supported-versions:
        description: 'Update supported-versions-gen.json on staging before running tests.'
        type: boolean
        default: false

env:
  addon: ${{ inputs.addon }}
  version: ${{ inputs.version }}
  prefix: ${{ inputs.prefix }}
  update_supported_versions: ${{ inputs.update-supported-versions }}

jobs:
  test-addon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Queue targeted legacy RC upgrade scenarios
        env:
          TESTGRID_API_TOKEN: ${{ secrets.TESTGRID_PROD_API_TOKEN }}
        run: |
          set -euo pipefail
          ref="swimlane-6153-legacy-5ba486792-$(date --utc +%FT%TZ)"
          docker run --rm -e TESTGRID_API_TOKEN -v "$(pwd)":/wrk -w /wrk \
            replicated/tgrun:latest queue --staging \
              --ref "$ref" \
              --spec testgrid/specs/swimlane-kubernetes-legacy.yaml \
              --os-spec testgrid/specs/os-firstlast.yaml \
              --priority 0
          echo "::notice ::Testgrid Run Executing @ https://testgrid.kurl.sh/run/$ref"
