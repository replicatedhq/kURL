name: Restore audited staging package cache

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Copy verified unchanged package artifacts into missing staging-root caches
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: restore-audited-staging-cache
  cancel-in-progress: false

jobs:
  restore-cache:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify and optionally restore staging cache
        env:
          APPLY_CACHE_RESTORE: ${{ inputs.apply }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PROD_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PROD_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          restore_args=()
          if [[ "$APPLY_CACHE_RESTORE" == "true" ]]; then
            restore_args+=(--apply)
          fi
          python3 hack/staging-cache-recovery/restore.py --repo "$GITHUB_WORKSPACE" "${restore_args[@]}"
