- installerSpec:
    kubernetes:
      version: "latest"
    weave:
      version: "latest"
    containerd:
      version: "latest"
    collectd:
      version: "__testver__"
      s3Override: "__testdist__"
  unsupportedOSIDs:
  - amazon-2023 # kubernetes latest (1.19) isnt supported on Amazon Linux 2023.
  preInstallScript: |
    source /opt/kurl-testgrid/testhelpers.sh
    amazon_2023_install_host_packages collectd collectd-rrdtool collectd-disk
    # BEGIN GENERATED os-matrix: ubuntu-host-packages — edit os-matrix.yaml, run 'make generate-os-matrix'
    ubuntu_2404_install_host_packages collectd
    ubuntu_2604_install_host_packages collectd
    # END GENERATED os-matrix: ubuntu-host-packages
