- name: Upgrade Containerd from 1.7.x to __testver__
  installerApiEndpoint: https://kurl.sh
  installerSpec:
    sonobuoy:
      version: "0.57.3"
    kubernetes:
      version: "1.34.11"
    flannel:
      version: "0.28.9"
    containerd:
      version: "1.7.x"
    openebs:
      version: "4.6.0"
      isLocalPVEnabled: true
      localPVStorageClassName: default
    minio:
      version: "2025-10-15T17-29-55Z"
    ekco:
      version: "0.28.15"
    kotsadm:
      version: "1.132.0"
  upgradeSpec:
    sonobuoy:
      version: "0.57.3"
    kubernetes:
      version: "1.34.11"
    flannel:
      version: "0.28.9"
    containerd:
      version: "__testver__"
      s3Override: "__testdist__"
    openebs:
      version: "4.6.0"
      isLocalPVEnabled: true
      localPVStorageClassName: default
    minio:
      version: "2025-10-15T17-29-55Z"
    ekco:
      version: "0.28.15"
    kotsadm:
      version: "1.132.0"
  postInstallScript: |
    source /opt/kurl-testgrid/testhelpers.sh
    minio_object_store_info
    validate_read_write_object_store rwtest testfile.txt
    echo "Checking kubectl with kube/config"
    echo "Kubeconfig was $KUBECONFIG"
    unset KUBECONFIG
    kubectl get namespaces
  postUpgradeScript: |
    source /opt/kurl-testgrid/testhelpers.sh
    minio_object_store_info
    validate_testfile rwtest testfile.txt
    validate_read_write_object_store postupgrade upgradefile.txt
    containerd --version
    systemctl is-active --quiet containerd
    if ! is_ubuntu_2404 && ! is_ubuntu_2604 && ! is_amazon_2023; then
      containerd --version | grep "__testver__"
    fi
  unsupportedOSIDs:
    - centos-74
    - centos-79
    - ol-79

