- name: basic containerd and flannel, internal LB, airgap, 1.32
  airgap: true
  installerSpec:
    kubernetes:
      version: "1.32.x"
    flannel:
      version: latest
    containerd:
      version: "__testver__"
      s3Override: "__testdist__"
    openebs:
      version: latest
      isLocalPVEnabled: true
      localPVStorageClassName: default
    minio:
      version: latest
    ekco:
      version: latest
      enableInternalLoadBalancer: true
    kotsadm:
      version: latest
  preInstallScript: |
    source /opt/kurl-testgrid/testhelpers.sh
    rhel_9_install_host_packages lvm2 conntrack-tools socat container-selinux git
    amazon_2023_install_host_packages containerd
    # BEGIN GENERATED os-matrix: ubuntu-host-packages — edit os-matrix.yaml, run 'make generate-os-matrix'
    ubuntu_2404_install_host_packages containerd
    ubuntu_2604_install_host_packages containerd
    # END GENERATED os-matrix: ubuntu-host-packages

  postInstallScript: |
    echo "checking /etc/containerd/config.toml"
    cat /etc/containerd/config.toml | grep pause # should be 3.10, this is for debugging
    cat /etc/containerd/config.toml | grep pause:3.10
    echo "checking /var/lib/kubelet/kubeadm-flags.env"
    cat /var/lib/kubelet/kubeadm-flags.env | grep pause # should be 3.10, this is for debugging
    cat /var/lib/kubelet/kubeadm-flags.env | grep pause:3.10
    # containerd 2.x add-ons install runc 1.3.6 on OSes that only get a containerd 1.x package
    # (ubuntu-18.04 is excluded below: no CVE-2026-41579-fixed runc runs on its 4.15 kernel)
    . /etc/os-release
    case "__testver__-$ID-$VERSION_ID" in
      2.*-amzn-2|2.*-centos-7*|2.*-rhel-7*|2.*-ol-7*)
        runc --version
        runc --version | grep -q 'runc version 1.3.6'
        ;;
    esac
  unsupportedOSIDs:
    - ubuntu-1804 # no CVE-2026-41579-fixed runc (>= 1.3.6) runs on its 4.15 kernel

- name: basic containerd and flannel, internal LB, airgap, 1.33 to 1.35, airgap
  airgap: true
  installerSpec:
    kubernetes:
      version: "1.33.x"
    flannel:
      version: latest
    containerd:
      version: "__testver__"
      s3Override: "__testdist__"
    openebs:
      version: latest
      isLocalPVEnabled: true
      localPVStorageClassName: default
    minio:
      version: latest
    ekco:
      version: latest
      enableInternalLoadBalancer: true
    kotsadm:
      version: latest
  upgradeSpec:
    kubernetes:
      version: "1.35.x"
    flannel:
      version: latest
    containerd:
      version: "__testver__"
      s3Override: "__testdist__"
    openebs:
      version: latest
      isLocalPVEnabled: true
      localPVStorageClassName: default
    minio:
      version: latest
    ekco:
      version: latest
      enableInternalLoadBalancer: true
    kotsadm:
      version: latest
  preInstallScript: |
    source /opt/kurl-testgrid/testhelpers.sh
    rhel_9_install_host_packages lvm2 conntrack-tools socat container-selinux git
    mkdir -p /var/lib/kurl/assets
    ( cd /var/lib/kurl/assets && curl -fLO "$(kubernetes_upgrade_bundle_url "$KURL_URL" "$KURL_UPGRADE_URL")" )
  unsupportedOSIDs:
    - centos-79
    - ol-79
    - ubuntu-1804 # no CVE-2026-41579-fixed runc (>= 1.3.6) runs on its 4.15 kernel

- name: Upgrade Containerd from 1.7.x to __testver__
  installerApiEndpoint: https://kurl.sh
  installerSpec:
    kubernetes:
      version: "1.34.x"
    flannel:
      version: latest
    containerd:
      version: "1.7.x"
    openebs:
      version: latest
      isLocalPVEnabled: true
      localPVStorageClassName: default
    minio:
      version: latest
    ekco:
      version: latest
    kotsadm:
      version: latest
  upgradeSpec:
    kubernetes:
      version: "1.34.x"
    flannel:
      version: latest
    containerd:
      version: "__testver__"
      s3Override: "__testdist__"
    openebs:
      version: latest
      isLocalPVEnabled: true
      localPVStorageClassName: default
    minio:
      version: latest
    ekco:
      version: latest
    kotsadm:
      version: latest
  postInstallScript: |
    source /opt/kurl-testgrid/testhelpers.sh
    minio_object_store_info
    validate_read_write_object_store rwtest testfile.txt
    echo "Checking kubectl with kube/config"
    echo "Kubeconfig was $KUBECONFIG"
    unset KUBECONFIG
    kubectl get namespaces
  postUpgradeScript: |
    source /opt/kurl-testgrid/testhelpers.sh
    minio_object_store_info
    validate_testfile rwtest testfile.txt
    validate_read_write_object_store postupgrade upgradefile.txt
    containerd --version
    systemctl is-active --quiet containerd
    if ! is_ubuntu_2404 && ! is_ubuntu_2604 && ! is_amazon_2023; then
      containerd --version | grep "__testver__"
    fi
  unsupportedOSIDs:
    - centos-79
    - ol-79
    - amzn-20 # gets a containerd 1.6 package, and containerd 1.6 to 2.x upgrades are not supported
    - ubuntu-1804 # 2.x blocked on 18.04 by preflight; 1.6-to-2.x upgrades unsupported regardless

