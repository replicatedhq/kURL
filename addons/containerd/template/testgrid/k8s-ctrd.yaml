- name: "Upgrade Containerd from current to __testver__"
  installerSpec:
    kubernetes:
      version: "1.32.x"
    flannel:
      version: latest
    containerd:
      # Keep the baseline published when staging metadata includes the candidate.
      version: "2.3.3"
    openebs:
      version: latest
      isLocalPVEnabled: true
      localPVStorageClassName: default
    minio:
      version: latest
    ekco:
      version: latest
    kotsadm:
      version: latest
  upgradeSpec:
    kubernetes:
      version: "1.32.x"
    flannel:
      version: latest
    containerd:
      version: "__testver__"
      s3Override: "__testdist__"
    openebs:
      version: latest
      isLocalPVEnabled: true
      localPVStorageClassName: default
    minio:
      version: latest
    ekco:
      version: latest
    kotsadm:
      version: latest
  postInstallScript: |
    source /opt/kurl-testgrid/testhelpers.sh
    minio_object_store_info
    validate_read_write_object_store rwtest testfile.txt
  postUpgradeScript: |
    source /opt/kurl-testgrid/testhelpers.sh
    minio_object_store_info
    validate_testfile rwtest testfile.txt
    validate_read_write_object_store postupgrade upgradefile.txt
    containerd --version
    if ! is_ubuntu_2404 && ! is_ubuntu_2604 && ! is_amazon_2023; then
      containerd --version | grep "__testver__"
    fi

