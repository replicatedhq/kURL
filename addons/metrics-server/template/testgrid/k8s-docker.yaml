- name: "fresh install"
  installerSpec:
    kubernetes:
      version: "1.35.8"
    flannel:
      version: "0.28.9"
    containerd:
      version: "2.3.3"
    sonobuoy:
      version: "0.57.3"
    metricsServer:
      version: "__testver__"
      s3Override: "__testdist__"
  postInstallScript: |
    sleep 30
    kubectl top pods -A
    kubectl top nodes
  # Focus on modern OSs with the published containerd 2.3 baseline.
  unsupportedOSIDs:
  - amzn-20
  - centos-79
  - ol-79
  - ubuntu-1804
- name: "upgrade from 0.8.1"
  installerSpec:
    kubernetes:
      version: "1.35.8"
    flannel:
      version: "0.28.9"
    containerd:
      version: "2.3.3"
    sonobuoy:
      version: "0.57.3"
    metricsServer:
      version: "0.8.1"
  upgradeSpec:
    kubernetes:
      version: "1.35.8"
    flannel:
      version: "0.28.9"
    containerd:
      version: "2.3.3"
    sonobuoy:
      version: "0.57.3"
    metricsServer:
      version: "__testver__"
      s3Override: "__testdist__"
  postUpgradeScript: |
    sleep 30
    kubectl top pods -A
    kubectl top nodes
  # Focus on modern OSs with the published containerd 2.3 baseline.
  unsupportedOSIDs:
  - amzn-20
  - centos-79
  - ol-79
  - ubuntu-1804
