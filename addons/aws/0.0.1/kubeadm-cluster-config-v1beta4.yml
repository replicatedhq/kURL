---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
metadata:
  name: kubeadm-cluster-configuration
networking:
  podSubnet: $POD_CIDR
  serviceSubnet: $SERVICE_CIDR
apiServer:
  extraArgs:
  - name: cloud-provider
    value: aws
  - name: enable-admission-plugins
    value: DefaultStorageClass
controllerManager:
  extraArgs:
  - name: cloud-provider
    value: aws
  - name: configure-cloud-routes
    value: '"true"'
  - name: address
    value: 0.0.0.0
