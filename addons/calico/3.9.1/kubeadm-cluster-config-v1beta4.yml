---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
metadata:
  name: kubeadm-cluster-configuration
networking:
  podSubnet: $POD_CIDR
  serviceSubnet: $SERVICE_CIDR
controllerManager:
  extraArgs:
  - name: allocate-node-cidrs
    value: \"true\"
  - name: cluster-cidr
    value: $POD_CIDR
