- name: fresh install
  installerSpec:
    kubernetes:
      version: "1.35.x"
    weave:
      version: "latest"
    containerd:
      version: "latest"
    goldpinger:
      version: "__testver__"
      s3Override: "__testdist__"
  postInstallScript: |
    # find the goldpinger endpoint
    export GP_ENDPOINT=$(kubectl get endpoints -n kurl goldpinger | grep -v NAME | awk '{ print $2 }')

    # print goldpinger output (and fail if unable to connect to the service)
    curl $GP_ENDPOINT/check_all
    curl $GP_ENDPOINT/metrics

    # Check if the support bundle spec was installed
    echo "test whether the goldpinger support bundle spec was installed"
    supportBundle=$(kubectl get secrets -n kurl kurl-goldpinger-supportbundle-spec -ojsonpath='{.data.support-bundle-spec}')
    echo "$supportBundle"
    echo "test if the content of the secret is a support bundle spec"
    echo $supportBundle | base64 -d | grep 'kind: SupportBundle'
    echo "test if the support bundle has 'troubleshoot.io/kind: support-bundle' label"
    kubectl get secrets -n kurl kurl-goldpinger-supportbundle-spec -oyaml | grep 'troubleshoot.io/kind: support-bundle'
  unsupportedOSIDs:
    - centos-79
    - ol-79
    - ol-8x
    - amzn-20
    - ubuntu-1804
- name: upgrade from 3.10.x
  installerSpec:
    kubernetes:
      version: "1.35.x"
    flannel:
      version: "latest"
    containerd:
      version: "latest"
    goldpinger:
      version: "3.10.x"
  upgradeSpec:
    kubernetes:
      version: "1.35.x"
    flannel:
      version: "latest"
    containerd:
      version: "latest"
    goldpinger:
      version: "__testver__"
      s3Override: "__testdist__"
  postUpgradeScript: |
    # find the goldpinger endpoint
    export GP_ENDPOINT=$(kubectl get endpoints -n kurl goldpinger | grep -v NAME | awk '{ print $2 }')

    # print goldpinger output (and fail if unable to connect to the service)
    curl $GP_ENDPOINT/check_all
    curl $GP_ENDPOINT/metrics
    
    # For migration tests - check if pods have the Bloomberg chart label
    chart_source=$(kubectl get daemonset -n kurl goldpinger -o jsonpath="{.spec.template.metadata.labels['kurl\.sh/goldpinger-chart']}" 2>/dev/null || echo "")
    if [[ "$chart_source" == "bloomberg" ]]; then
      echo "Bloomberg chart migration completed successfully - pod label verified"
    fi
  unsupportedOSIDs:
    - centos-79
    - ol-79
    - ol-8x
    - amzn-20
    - ubuntu-1804

