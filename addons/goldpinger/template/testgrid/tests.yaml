- name: airgap fresh install
  airgap: true
  installerSpec:
    kubernetes:
      version: "1.35.x"
    flannel:
      version: "latest"
    containerd:
      version: "latest"
    goldpinger:
      version: "__testver__"
      s3Override: "__testdist__"
  preInstallScript: |
    source /opt/kurl-testgrid/testhelpers.sh
    rhel_9_install_host_packages lvm2 conntrack-tools socat container-selinux git
