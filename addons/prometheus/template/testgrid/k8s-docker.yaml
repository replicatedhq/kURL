- name: "prometheus minimal airgap"
  installerSpec:
    kubernetes:
      version: "1.31.x"
    flannel:
      version: latest
    rook:
      version: "1.12.x"
      isBlockStorageEnabled: true
    containerd:
      version: "latest"
    prometheus:
      version: "__testver__"
      s3Override: "__testdist__"
  airgap: true
  preInstallScript: |
    source /opt/kurl-testgrid/testhelpers.sh
    rhel_9_install_host_packages lvm2 conntrack-tools socat container-selinux git
