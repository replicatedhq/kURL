- name: "prometheus minimal k8s 1.31"
  installerSpec:
    kubernetes:
      version: "1.31.x"
    flannel:
      version: latest
    openebs:
      version: "latest"
      isLocalPVEnabled: true
      localPVStorageClassName: default
    containerd:
      version: "latest"
    prometheus:
      version: "__testver__"
      s3Override: "__testdist__"
  postInstallScript: |
    kubectl -n monitoring rollout status deployment/prometheus-operator --timeout=180s
    kubectl -n monitoring wait --for=create statefulset/prometheus-k8s --timeout=180s
    kubectl -n monitoring rollout status statefulset/prometheus-k8s --timeout=300s
    kubectl -n monitoring rollout status deployment/grafana --timeout=180s
    kubectl get --raw /api/v1/namespaces/monitoring/services/prometheus-k8s:9090/proxy/-/ready
- name: "prometheus upgrade from 0.49.x"
  installerApiEndpoint: https://kurl.sh
  installerSpec:
    kurl:
      installerVersion: "v2024.07.02-0"
    kubernetes:
      version: "1.21.x"
    flannel:
      version: latest
    openebs:
      version: "latest"
      isLocalPVEnabled: true
      localPVStorageClassName: localpv
    containerd:
      version: "1.6.x"
    prometheus:
      version: "0.49.x"
  upgradeSpec:
    kubernetes:
      version: "1.23.x"
    flannel:
      version: latest
    openebs:
      version: "latest"
      isLocalPVEnabled: true
      localPVStorageClassName: localpv
    containerd:
      version: "1.7.x"
    prometheus:
      version: "__testver__"
      s3Override: "__testdist__"
  unsupportedOSIDs:
  - amazon-2023 # Kubernetes < 1.24 are not supported on Amazon Linux.
  - rocky-9 # Pinned installer version v2024.07.02-0 does not support rocky 9.
  - ubuntu-2404 # Pinned installer version v2024.07.02-0 does not support ubuntu 24.04.
  - ubuntu-2604 # Pinned installer version v2024.07.02-0 does not support ubuntu 26.04.
  - centos-9 # Pinned installer version v2024.07.02-0 does not support centos 9.
