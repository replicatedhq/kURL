# Focused CVE validation: current install, current-release upgrade, and airgap.
# Historical 0.33/0.49 migration and Longhorn/Kubernetes 1.24 fixtures are
# preserved on the PR branch, but are not validated by this focused run.
- name: "prometheus minimal k8s 1.31"
  installerSpec:
    kubernetes:
      version: "1.31.14"
    flannel:
      version: "0.28.9"
    openebs:
      version: "4.6.0"
      isLocalPVEnabled: true
      localPVStorageClassName: default
    containerd:
      version: "2.3.3"
    sonobuoy:
      version: "0.57.3"
    prometheus:
      version: "__testver__"
      s3Override: "__testdist__"
  postInstallScript: |
    kubectl -n monitoring rollout status deployment/prometheus-operator --timeout=180s
    kubectl -n monitoring wait --for=create statefulset/prometheus-k8s --timeout=180s
    kubectl -n monitoring rollout status statefulset/prometheus-k8s --timeout=300s
    kubectl -n monitoring rollout status deployment/grafana --timeout=180s
    kubectl get --raw /api/v1/namespaces/monitoring/services/prometheus-k8s:9090/proxy/-/ready
  # Exclude known legacy-OS infrastructure failures from this focused run.
  unsupportedOSIDs:
  - amzn-20
  - centos-79
  - ol-79
  - ubuntu-1804
- name: "prometheus upgrade from 0.92.1-87.15.1"
  installerApiEndpoint: https://kurl.sh
  installerSpec:
    kubernetes:
      version: "1.31.14"
    flannel:
      version: "0.28.9"
    openebs:
      version: "4.6.0"
      isLocalPVEnabled: true
      localPVStorageClassName: default
    containerd:
      version: "2.3.3"
    sonobuoy:
      version: "0.57.3"
    prometheus:
      version: "0.92.1-87.15.1"
  upgradeSpec:
    kubernetes:
      version: "1.31.14"
    flannel:
      version: "0.28.9"
    openebs:
      version: "4.6.0"
      isLocalPVEnabled: true
      localPVStorageClassName: default
    containerd:
      version: "2.3.3"
    sonobuoy:
      version: "0.57.3"
    prometheus:
      version: "__testver__"
      s3Override: "__testdist__"
  postUpgradeScript: |
    kubectl -n monitoring rollout status deployment/prometheus-operator --timeout=180s
    kubectl -n monitoring wait --for=create statefulset/prometheus-k8s --timeout=180s
    kubectl -n monitoring rollout status statefulset/prometheus-k8s --timeout=300s
    kubectl -n monitoring rollout status deployment/grafana --timeout=180s
    kubectl get --raw /api/v1/namespaces/monitoring/services/prometheus-k8s:9090/proxy/-/ready
  # Exclude known legacy-OS infrastructure failures from this focused run.
  unsupportedOSIDs:
  - amzn-20
  - centos-79
  - ol-79
  - ubuntu-1804
- name: "prometheus minimal airgap"
  installerSpec:
    kubernetes:
      version: "1.31.14"
    flannel:
      version: "0.28.9"
    rook:
      version: "1.12.8"
      isBlockStorageEnabled: true
    containerd:
      version: "2.3.3"
    sonobuoy:
      version: "0.57.3"
    prometheus:
      version: "__testver__"
      s3Override: "__testdist__"
  airgap: true
  preInstallScript: |
    source /opt/kurl-testgrid/testhelpers.sh
    rhel_9_install_host_packages lvm2 conntrack-tools socat container-selinux git
  # Exclude known legacy-OS infrastructure failures from this focused run.
  unsupportedOSIDs:
  - amzn-20
  - centos-79
  - ol-79
  - ubuntu-1804
