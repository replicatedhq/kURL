- name: fresh install
  installerSpec:
    kubernetes:
      version: "1.35.x"
    flannel:
      version: "latest"
    containerd:
      version: "latest"
    certManager:
      version: "__testver__"
      s3Override: "__testdist__"
  postInstallScript: |
    kubectl get crds
    kubectl get all -n cert-manager
    kubectl create -f https://raw.githubusercontent.com/cert-manager/cert-manager/v__testver__/test/fixtures/cert-manager-resources.yaml
    kubectl wait --for=condition=Ready certificate/test1 certificate/test2 --timeout=120s
    kubectl describe certificates
    
    # setup cmctl
    curl -fsSL -o cmctl https://github.com/cert-manager/cmctl/releases/latest/download/cmctl_linux_amd64
    chmod +x cmctl
    sudo mv cmctl /usr/local/bin
    
    cmctl check api

# cert-manager 1.21 supports Kubernetes 1.33-1.36. The historical 1.0.3
# migration on Kubernetes 1.19 -> 1.25 is outside that support matrix;
# exercise a supported previous-minor upgrade here instead.
- name: upgrade from 1.20.3
  installerSpec:
    kubernetes:
      version: "1.35.x"
    flannel:
      version: "latest"
    containerd:
      version: "latest"
    certManager:
      version: "1.20.3"
  upgradeSpec:
    kubernetes:
      version: "1.35.x"
    flannel:
      version: "latest"
    containerd:
      version: "latest"
    certManager:
      version: "__testver__"
      s3Override: "__testdist__"
  postInstallScript: |
    kubectl get crds
    kubectl get all -n cert-manager
    kubectl create -f https://raw.githubusercontent.com/cert-manager/website/80e45cea5374c15fe784b2544e2e5d14b22b5416/content/docs/tutorials/acme/example/staging-issuer.yaml
    kubectl get issuers letsencrypt-staging
  postUpgradeScript: |
    kubectl get pods -n cert-manager
    kubectl get issuers letsencrypt-staging
    kubectl create -f https://raw.githubusercontent.com/cert-manager/cert-manager/v__testver__/test/fixtures/cert-manager-resources.yaml
    kubectl wait --for=condition=Ready certificate/test1 certificate/test2 --timeout=120s

