# os-matrix.yaml — the single source of truth for kURL's supported operating systems.
#
# Each OS is declared once here; every downstream OS-keyed artifact (testgrid OS
# specs, and — as the refactor lands — shell predicates, preflight rules, host
# package plumbing and the Ubuntu build Dockerfile/Makefile targets) is RENDERED
# from this file and committed. Adding a supported OS should be one entry here
# plus `make generate-os-matrix`.
#
# See replicatedhq/kURL#6081. Do not hand-edit generated artifacts; edit this
# file and regenerate. `make verify-generated` fails if committed generated
# files drift from this source.
#
# SCOPE / intentional exclusions: the "single registry entry to add an OS"
# guarantee covers the active/template artifacts. It does NOT rewrite the
# pinned, frozen containerd addon versions (the apt<NN> lines already committed
# in addons/containerd/<1.5.x-2.2.x>/Manifest and any guards in their frozen
# install.sh) — those are immutable released versions. Only the containerd
# template (template/base + template/script.sh) and the currently-active
# per-version install.sh guards are registry-driven; a future containerd
# generation picks up new OSes from there. The legacy Ubuntu Makefile build
# targets (18.04/20.04/22.04) and their older bundle Dockerfiles also stay
# hand-authored (distinct legacy build flow).
#
# Fields:
#   key            unique registry key (defaults to id). Set only when two
#                  entries share a testgrid id but differ (e.g. a pinned minor).
#   id             testgrid OS id emitted into testgrid/specs/*.yaml
#   name/version   testgrid display name/version
#   vmimageuri     testgrid cloud image
#   preinit        testgrid pre-init script
#   preinitStyle   how preinit is serialized: empty | quoted | block
#                  (presentation only; keeps regenerated specs byte-identical)
#   distro/versionMajor/packageFamily  installer identity (shell/build plumbing)
#   minKubernetes/dockerSupported/apparmorWorkaround/hostPackagesShipped
#                  capability constraints (drive computed preflight/exclusion rules)
#   family         membership in a `families` entry below (shared shell predicate)

# families are distro families whose membership is defined by an $LSB_DIST set and
# a set of $DIST_VERSION_MAJOR values rather than by a single OS row. Each renders
# one shared shell predicate (is_<predicate>) into scripts/common/host-packages.sh
# — called by hand-written installer code and by the generated host_packages_shipped
# guard. A family exists because its predicate must match machines kURL never
# testgrids (e.g. stock RHEL) across several distros/majors. OSes join a family via
# their `family:` tag; later convoy legs (Rocky/Oracle/Amazon-2023/Ubuntu-legacy)
# add their family's per-OS capability data on top of this shared model — e.g. a
# Rocky leg tags rocky-9/rocky-10 with `family: rhel-9-variant`.
#
# Fields:
#   name/predicate  registry key / rendered shell function name
#   description     completes the predicate doc comment
#   lsbDist         the $LSB_DIST tokens the predicate matches
#   versionMajors   the $DIST_VERSION_MAJOR values the predicate matches
#   hostPackagesShipped  true => family is handled by a dedicated/native package
#                  path, so it is excluded from generic host_packages_shipped
#                  detection (its predicate appears in that guard's negated clause).
families:
  - name: rhel-9-variant
    predicate: is_rhel_9_variant
    description: RHEL 9 (or 10) or a derivative
    lsbDist: [centos, rhel, ol, rocky]
    versionMajors: ["9", "10"]
    hostPackagesShipped: true

  - name: amazon-2023
    predicate: is_amazon_2023
    description: Amazon 2023.
    lsbDist: [amzn]
    versionMajors: ["2023"]
    hostPackagesShipped: true

