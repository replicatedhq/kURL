# pools are ordered id lists that render to testgrid/specs/<name>.yaml.
# trailingNewline preserves whether the committed file ends with a newline.
pools:
  - name: os-latest
    trailingNewline: false
    ids: [amzn-20, centos-79, ol-79, rocky-9, rocky-10, centos-9, ubuntu-1804, ubuntu-2204, ubuntu-2404, amazon-2023, ubuntu-2604]

  - name: os-firstlast
    trailingNewline: false
    ids: [amzn-20, centos-79, ol-79, rocky-9, rocky-10, centos-9, ubuntu-1804, ubuntu-2004, ubuntu-2204, ubuntu-2404, amazon-2023, ubuntu-2604]

  - name: os-customer-common
    trailingNewline: true
    ids: [rocky-9-customer, ubuntu-2204, ubuntu-2604]

  - name: os-full
    trailingNewline: true
    ids: [amzn-20, centos-79, ol-79, ol-8x, rocky-91, rocky-98, rocky-10, centos-9, ubuntu-1804, ubuntu-2004, ubuntu-2204, ubuntu-2404, amazon-2023, ubuntu-2604]

